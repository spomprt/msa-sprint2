stages:
  - build
  - test
  - deploy-staging
  - deploy-production

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$CI_PROJECT_DIR/.certs"

# Build stage
build:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - docker info
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main
    - develop

# Test stage
test:
  stage: test
  image: golang:1.21-alpine
  before_script:
    - apk add --no-cache git
    - go mod download
  script:
    - go test -v ./...
    - go vet ./...
    - go fmt ./...
  only:
    - main
    - develop
    - merge_requests

# Deploy to staging
deploy-staging:
  stage: deploy-staging
  image: alpine/helm:3.12.0
  before_script:
    - apk add --no-cache curl
    - helm repo add stable https://charts.helm.sh/stable
    - helm repo update
  script:
    - kubectl config use-context $KUBE_CONTEXT_STAGING
    - helm upgrade --install booking-service ./helm/booking-service \
        --namespace staging \
        --create-namespace \
        --values values-staging.yaml \
        --set image.tag=$CI_COMMIT_SHA \
        --wait --timeout=300s
    - kubectl rollout status deployment/booking-service -n staging
  environment:
    name: staging
    url: https://staging.example.com
  only:
    - develop
  when: manual

# Deploy to production
deploy-production:
  stage: deploy-production
  image: alpine/helm:3.12.0
  before_script:
    - apk add --no-cache curl
    - helm repo add stable https://charts.helm.sh/stable
    - helm repo update
  script:
    - kubectl config use-context $KUBE_CONTEXT_PRODUCTION
    - helm upgrade --install booking-service ./helm/booking-service \
        --namespace production \
        --create-namespace \
        --values values-prod.yaml \
        --set image.tag=$CI_COMMIT_SHA \
        --wait --timeout=300s
    - kubectl rollout status deployment/booking-service -n production
  environment:
    name: production
    url: https://example.com
  only:
    - main
  when: manual

# Security scan
security-scan:
  stage: test
  image: aquasec/trivy:latest
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL .
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# Dependency check
dependency-check:
  stage: test
  image: owasp/zap2docker-stable:latest
  script:
    - zap-baseline.py -t http://localhost:8080
  allow_failure: true
  only:
    - main
    - develop
