# Production environment configuration
replicaCount: 3

image:
  name: booking-service
  tag: production
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

featureFlags:
  enableFeatureX: false
  enableFeatureY: false
  enableDebugMode: false

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /ping
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ping
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Production-specific configurations
environment: production
logLevel: info
enableMetrics: true
enableTracing: false

# Horizontal Pod Autoscaler for production
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

# Production security settings
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Network policies
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2
