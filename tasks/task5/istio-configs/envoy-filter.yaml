apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: booking-service-canary-filter
  namespace: default
spec:
  configPatches:
  # Добавляем fault injection фильтр для тестирования
  - applyTo: HTTP_FILTER
    match:
      context: SIDECAR_OUTBOUND
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
            subFilter:
              name: envoy.filters.http.cors  # Добавляем перед CORS фильтром
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.fault
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.http.fault.v3.HTTPFault
          abort:
            http_status: 500
            percentage:
              denominator: HUNDRED
              numerator: 0
          delay:
            fixed_delay: 1ms
            percentage:
              denominator: HUNDRED
              numerator: 0
  workloadSelector:
    labels:
      app: booking-service
